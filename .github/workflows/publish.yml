name: Publish to NPM
permissions:
  contents: read
on:
  release:
    types: [created]
jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write # Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
      - name: Install latest npm
        run: npm install -g npm@11.5.1
      - name: Install dependencies and build with builder bob
        run: yarn install --frozen-lockfile
      - name: Publish package on NPM 📦
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # If prerelease (contains "-"), publish with a non-latest tag
          if [[ "$VERSION" == *-* ]]; then
            # Derive tag from prerelease identifier before optional dot
            TAG=$(echo "$VERSION" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-([0-9A-Za-z-]+)(\..*)?$/\1/')
            npm publish --access=public --tag="$TAG" --provenance
          else
            npm publish --access=public --provenance
          fi